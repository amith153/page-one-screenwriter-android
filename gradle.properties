# Keep memory use modest so builds work on laptops with 8 GB RAM.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC -Dfile.encoding=UTF-8
# Compile Kotlin inside the Gradle process instead of starting a second ~3 GB JVM.
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx1536m -XX:+UseSerialGC
org.gradle.configuration-cache=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
# Let APKs built with the Run button install on other phones too
# (by default Android Studio marks them "test only" and other phones reject them).
android.injected.testOnly=false
